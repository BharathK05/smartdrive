<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartDrive</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
  <style>
    .tag { display: inline-block; padding: .1rem .6rem; margin: 0 .3rem .3rem 0; border-radius: 1rem;
           font-size: .8rem; background: #e0ecff; color: #1d4ed8; }
    @media (prefers-color-scheme: dark) { .tag { background: #1e3a5f; color: #bfdbfe; } }
    .auth { max-width: 420px; margin: 2rem auto; }
    .actions { display: flex; flex-wrap: wrap; gap: .5rem; }
    .actions form { margin: 0; }
    .file-meta { color: var(--pico-muted-color); font-size: .85rem; }
  </style>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><strong>☁️ SmartDrive</strong></li></ul>
      {% if session.email %}
      <ul>
        <li><small>{{ session.email }}</small></li>
        <li><a href="{{ url_for('logout') }}">Log out</a></li>
      </ul>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% for message in get_flashed_messages() %}<article>{{ message }}</article>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
